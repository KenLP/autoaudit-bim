- id: va.bim.properties.wall_fire_rating_in_type
  parameter: Fire Rating
  requirement: present_and_nonempty
  category: Walls
  severity_tag: fire_safety_change
  description: Fire rating fill patterns must be constructed within 3D wall types
    so that the partition's rating is shown through all scales and views. Walls must
    carry a non-empty Fire Rating value on their type.
  autofill:
    strategy: none
  citation:
    mode: soft
    on_missing: warn
  fixability: manual
  remediation:
    action: create_acc_issue
    new_value_strategy: inferred
    target: instance
    llm_safety_critical: false
  requires_human: false
  rule_type: value_constraint
  extraction_meta:
    confidence: 0.82
    source_text: Fire rating fill patterns must be constructed within 3D wall types
      so that the partition's respective rating is shown through all scales and types
      of views, including 2D Drawings.
    source_location: VA BIM Standard §2.5 p.12
    extracted_by: claude-sonnet-4-6
    extracted_at: '2026-07-15T15:25:28Z'
    execution_status: executable
    notes:
    - The clause implies all wall types must encode their fire rating within the type
      definition (not as a manual annotation).
    - A blank Fire Rating on a wall type may indicate the partition has no rating,
      but the BIM team must explicitly set 'Not Rated' or equivalent rather than leaving
      empty.
- id: va.bim.object_tool.classification_required
  parameter: OmniClass Number
  requirement: present_and_nonempty
  category: Generic Models
  severity_tag: missing_required_param
  description: Any new BIM object must carry a proper classification (e.g. OmniClass)
    designating the real-world element it represents, enabling correct data reporting
    and export.
  autofill:
    strategy: none
  citation:
    mode: soft
    on_missing: warn
  fixability: manual
  remediation:
    action: create_acc_issue
    new_value_strategy: inferred
    target: instance
    llm_safety_critical: false
  requires_human: true
  rule_type: parameter_completeness
  extraction_meta:
    confidence: 0.72
    source_text: If a new object is created then it must be designated as the real
      world element it represents, having the proper classification and/or data attributes
      for the project and object type, and must report properly from the BIM software
      as the objects they represent rather than unassigned graphic primitives.
    source_location: VA BIM Standard §VA p.13
    extracted_by: claude-sonnet-4-6
    extracted_at: '2026-07-15T15:25:28Z'
    execution_status: executable
    notes:
    - OmniClass Number is the standard Revit classification parameter. Alternatively,
      the project BxP may designate a different classification scheme (e.g. UniFormat,
      CSI MasterFormat) — edit parameter name to match.
    - Rule is scoped to Generic Models as the highest-risk category for misclassification;
      BIM Manager may broaden to all categories.
