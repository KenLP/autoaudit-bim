- id: va.room.area.positive
  parameter: Area
  requirement: numeric_compare
  threshold: 0.0
  unit: ft²
  operator: '>'
  category: Rooms
  severity_tag: geometric_violation
  description: Every Room must have a positive computed area so that Circulation Factors
    can be correctly derived from BIM floorplate spatial values (VA BIM Standard §2.13).
  autofill:
    strategy: none
  citation:
    mode: soft
    on_missing: warn
  fixability: manual
  remediation:
    action: create_acc_issue
    new_value_strategy: inferred
    target: instance
    llm_safety_critical: false
  requires_human: false
  rule_type: value_constraint
  extraction_meta:
    confidence: 0.8
    source_text: 'Circulation Factors: Must be calculated based on the spatial values
      derived from the floorplates in BIM.'
    source_location: VA BIM Standard p.16 §2.13 / §VA
    extracted_by: claude-sonnet-4-6
    extracted_at: '2026-07-15T15:25:28Z'
    execution_status: executable
    notes:
    - Area is a Revit computed parameter driven by room boundary geometry; a zero/null
      value indicates an unbounded or incorrectly placed room.
    - AEs should consult their BIM authoring application vendor for the recommended
      room area measurement method per VA Standards Alert 16-002a.
