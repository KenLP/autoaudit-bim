  # MEP Spaces — the analytical twin of a Room: MEP quantities (airflow,
  # loads, ventilation) are computed PER SPACE, and Space Name/Number drive
  # the handover schedules. Distinct from `rooms` (OST_Rooms): a model can
  # carry both, and a duct belongs to a Space, not a Room.
  # aecdm_label deliberately null — not verified against a live AECDM model
  # (2026-08-01); Revit-backed runs are unaffected, AECDM runs warn + skip.
  - key: spaces
    display: Spaces
    aecdm_label: null
    ost: OST_MEPSpaces
    discipline: mep
    aliases: [Space, MEP Space, MEP Spaces, Không gian]

