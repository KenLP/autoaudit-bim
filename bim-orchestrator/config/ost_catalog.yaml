# OST Catalog — v1.3 foundation for rules-driven Query Agents.
#
# Purpose
# -------
# Single source of truth that maps a compliance-friendly label
# (the string a rule author writes in Rule.category) to:
#   * `ost`         — Revit BuiltInCategory enum string. Used by
#                     RevitMCPClient.list_elements(category=...).
#   * `aecdm_label` — Forma/AECDM display label. Used by
#                     FormaMCPClient.query_elements(category=...). May be
#                     null when AECDM doesn't expose that category — the
#                     loader warns and skips it for AECDM-backed runs.
#   * `display`     — human-readable name shown in reports / UI.
#   * `discipline`  — coarse grouping (architecture | structure | mep) for
#                     filtering + reporting only; not used at dispatch time.
#   * `aliases`     — alternative spellings (singular forms, abbreviations,
#                     Vietnamese names) that should resolve to this entry.
#
# Schema
# ------
# version: 1
# categories:
#   - key: <internal-stable-id, kebab-case>
#     display: <Pretty Name>
#     aecdm_label: <AECDM category string | null>
#     ost: OST_<BuiltInCategory>
#     discipline: <architecture | structure | mep>
#     aliases: [<str>, ...]   # optional
#
# Resolution behaviour (policies/ost_catalog.py)
# ----------------------------------------------
#   resolve(label, backend) →
#     1. exact match on `key`         (case-sensitive)
#     2. exact match on `display`     (case-sensitive)
#     3. case-insensitive match on display / key / aliases
#     4. Levenshtein distance ≤ 2 against display + aliases (typo tolerance)
#     5. unknown → log warn + return None (rule author sees a clear error,
#        not a silent zero-finding run)
#
# Backend selection
# -----------------
#   backend='revit' → returns entry.ost
#   backend='aecdm' → returns entry.aecdm_label (may be null → skip + warn)
#
# Adding a new category
# ---------------------
# When a rule needs a category not listed here:
#   1. Add an entry below in the right discipline section.
#   2. Set `ost` from Revit's BuiltInCategory enum (verify spelling — Revit
#      has quirks like OST_SpecialityEquipment (sic), OST_CurtaSystem,
#      OST_StructConnections, OST_Wire (singular)).
#   3. Set `aecdm_label` to the AECDM-exposed name if known; null otherwise.
#      A null label is honest — better than guessing and getting a silent
#      query failure on AECDM-backed runs.
#   4. Add at least the singular alias for English categories.

