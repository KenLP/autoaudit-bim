- id: va.room.area.present
  parameter: Area
  requirement: present_and_nonempty
  category: Rooms
  severity_tag: missing_required_param
  description: Every Room must have a non-empty Area (Net Square Footage) value modeled
    from BIM geometry (VA BIM Standard §2.13.3).
  autofill:
    strategy: none
  citation:
    mode: soft
    on_missing: warn
  fixability: manual
  remediation:
    action: create_acc_issue
    new_value_strategy: inferred
    target: instance
    llm_safety_critical: false
  requires_human: false
  rule_type: parameter_completeness
  extraction_meta:
    confidence: 0.91
    source_text: The Net Square Footage (NSF) must be modeled for each functional
      room and space.
    source_location: VA BIM Standard §2.13.3, p.15
    extracted_by: claude-sonnet-4-6
    extracted_at: '2026-07-15T15:25:28Z'
    execution_status: executable
    notes:
    - NSF must derive from bounding BIM geometry — not manually keyed. Revit Room
      'Area' parameter is geometry-driven, so presence implies model connectivity.
    - PFD NSF and proposed design NSF must be shown on all 2D plans in each room and
      space — plan annotation is a separate deliverable check beyond model parameter
      presence.
