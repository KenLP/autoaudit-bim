- id: va.bim.room.guid.required
  parameter: UniqueId
  requirement: present_and_nonempty
  category: Rooms
  severity_tag: missing_required_param
  description: Every Room (space) element must carry a non-empty Globally Unique Identifier
    (GUID), assigned via SEPS or the BIM authoring tool, and this GUID must be maintained
    throughout project development and delivery.
  autofill:
    strategy: none
  citation:
    mode: soft
    on_missing: warn
  fixability: manual
  remediation:
    action: create_acc_issue
    new_value_strategy: inferred
    target: instance
    llm_safety_critical: false
  requires_human: false
  rule_type: parameter_completeness
  extraction_meta:
    confidence: 0.82
    source_text: Unique GUIDs, assigned in the Space and Equipment Planning Tool (SEPS)
      or in the BIM tools, must be maintained throughout project development and delivery
      to support data workflows that require keeping track of space and equipment.
    source_location: VA BIM Standard §2.2, p.11
    extracted_by: claude-sonnet-4-6
    extracted_at: '2026-07-15T15:25:28Z'
    execution_status: executable
    notes:
    - Revit's built-in 'UniqueId' parameter is the closest native equivalent to the
      GUID described; BIM Manager should confirm the project uses SEPS-assigned GUIDs
      stored in a shared parameter if 'UniqueId' is not the correct binding.
    - GUID must persist through room name changes and other modifications per footnote
      8.
    - Edit 'parameter' to match the actual shared parameter name if SEPS exports GUIDs
      to a custom field (e.g. 'SEPS_GUID').
