  # categories use; the Revit query agent has a dedicated list_sheets
  # branch that flattens Sheet Number / Sheet Name into element params.
  # AECDM doesn't expose documentation elements → aecdm_label null
  # (skipped + warned on Forma-backed runs). `discipline` is a coarse
  # reporting bucket only; sheets are cross-discipline, filed under
  # architecture by convention.
  # --------------------------------------------------------------------
  - key: sheets
    display: Sheets
    aecdm_label: null
    ost: OST_Sheets
    discipline: architecture
    aliases: [Sheet, Drawing Sheet, Bản vẽ]
